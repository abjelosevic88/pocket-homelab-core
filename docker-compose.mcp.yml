# Build this checkout and enable named MCP credentials generated by `pocket-core mcp setup`.
# docker compose -f docker-compose.yml -f docker-compose.mcp.yml up -d --build
services:
  pocket-core:
    image: pocket-core:mcp-local
    build: .
    environment:
      MCP_CLIENTS_FILE: /run/pocket-mcp/clients.json
    volumes:
      # Mount the directory so atomic credential-file replacements are visible.
      # client.env (the actual token) remains outside this mounted directory.
      - ./mcp-secrets/server:/run/pocket-mcp:ro
