# Pocket Core — app registry, event bus, OIDC provider and device pairing for a Pocket Box. One container, one volume.
services:
  pocket-core:
    image: ghcr.io/abjelosevic88/pocket-homelab-core:latest
    container_name: pocket-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # The URL phones and apps reach Core at. Also the OIDC issuer.
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Fixed registration key for apps (otherwise one is generated and shown under Settings):
      REGISTRATION_KEY: ${REGISTRATION_KEY:-}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
