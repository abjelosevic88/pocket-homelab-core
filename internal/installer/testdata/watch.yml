# Pocket Watch — films and shows for the household on top of Jellyfin. Go + SQLite.
#
# With its own Jellyfin:  COMPOSE_PROFILES=jellyfin docker compose up -d
#   (or COMPOSE_PROFILES=jellyfin in .env, as in .env.example and Pocket Core's installer)
#   starts the app and Jellyfin, which Pocket Watch sets up by itself on the first
#   start (an administrator, an API key, Films and Shows libraries over the two
#   folders below); everyone who uses Pocket Watch gets an account of their own on
#   it. Jellyfin has no port of its own: only the app reaches it.
# With your Jellyfin:     JELLYFIN_URL=http://your-jellyfin:8096 docker compose up -d
#   starts only the app; everyone signs in with their own Jellyfin account under
#   Settings → Jellyfin. A Jellyfin that is already set up is never changed.
services:
  pocket-watch:
    image: ghcr.io/abjelosevic88/pocket-homelab-watch:latest
    container_name: pocket-watch
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # The Jellyfin below, or yours (see the top of this file).
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      # auto: set up a fresh Jellyfin (the one below); leave one that is set up alone
      JELLYFIN_BUNDLED: ${JELLYFIN_BUNDLED:-auto}
      # What a browser opens for "Open in Jellyfin", if you publish its port:
      JELLYFIN_PUBLIC_URL: ${JELLYFIN_PUBLIC_URL:-}
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Your own Jellyfin only: the admin's account there, copied once into their connection:
      # an API key + the account it acts as, or a username + password.
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_USER: ${JELLYFIN_USER:-}
      JELLYFIN_PASSWORD: ${JELLYFIN_PASSWORD:-}
      # The box's services (also under Settings → Services):
      JELLYSEERR_URL: ${JELLYSEERR_URL:-}
      JELLYSEERR_API_KEY: ${JELLYSEERR_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      MAINTAINERR_URL: ${MAINTAINERR_URL:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # Pocket Core: one sign-in, Jellyfin logins per person, Pocket AI.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      jellyfin:
        condition: service_started
        required: false   # only with the jellyfin profile

  # Jellyfin, the official image (the "jellyfin" profile). Put films in MOVIES_DIR
  # and shows in SHOWS_DIR (default: media/movies and media/shows next to this
  # file); Jellyfin notices new files by itself.
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: pocket-watch-jellyfin
    profiles: [jellyfin]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Jellyfin's database and artwork, and its transcoding scratch space
      - ${JELLYFIN_CONFIG_DIR:-./jellyfin/config}:/config
      - ${JELLYFIN_CACHE_DIR:-./jellyfin/cache}:/cache
      - ${MOVIES_DIR:-./media/movies}:/media/movies
      - ${SHOWS_DIR:-./media/shows}:/media/shows
    # Jellyfin's own apps on a TV or phone, and its dashboard (sign in as
    # "pocket-watch"; the password is under Settings → Jellyfin as an admin):
    # ports:
    #   - "8096:8096"
    # Hardware transcoding on an Intel/AMD GPU:
    # devices:
    #   - /dev/dri:/dev/dri
