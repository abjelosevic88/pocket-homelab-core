services:
  pocket-files:
    image: ghcr.io/abjelosevic88/pocket-homelab-files:latest
    container_name: pocket-files
    restart: unless-stopped
    ports:
      - "8080:8080"     # the app (keep it private: LAN, VPN or behind your login)
      - "8081:8081"     # share and upload pages only — the one to expose to the internet
    environment:
      TZ: ${TZ:-UTC}
      BASE_URL: ${BASE_URL:-}
      PUBLIC_PORT: "8081"
      # PUBLIC_URL: https://send.example.com   # links point here (default BASE_URL)
      # Set both to skip the first-run setup screen and create the admin directly:
      # ADMIN_EMAIL: ${ADMIN_EMAIL}
      # ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # SECURE_COOKIES: "true"                  # behind HTTPS
      # MOUNT_ROOTS: /mnt                       # admins may mount folders below this
      # NOTIFY_URL: http://apprise:8000/notify/files
      # CORE_URL: http://pocket-core:8080       # Pocket Core: sign-in, events, files for other Pocket apps
      # CORE_REGISTRATION_KEY: …
    volumes:
      - ./data:/data                            # database, everyone's files, sends, trash
      # - /mnt:/mnt                             # server folders to mount (same path inside)
