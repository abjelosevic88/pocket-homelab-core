<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Ask</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#253b30;background:#fafbf8;color-scheme:light;--surface:#fff;--muted:#6d7a70;--line:#e0e7df;--accent:#245c43;--soft:#edf3eb}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;font-size:14px}button,input,textarea,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:inherit;padding:9px 12px}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #61a783;outline-offset:2px}a{color:var(--accent);text-underline-offset:3px}header{padding:20px 60px 15px 20px;border-bottom:1px solid var(--line);flex-shrink:0}header .eyebrow{font-size:10px;letter-spacing:.15em;color:var(--muted);font-weight:700}header h1{font-size:22px;letter-spacing:-.6px;margin:4px 0 0}#context{padding:12px 20px;background:var(--soft);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:12px}#context span{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}#context button{padding:5px 8px;font-size:11px;white-space:nowrap}#content{flex:1;min-height:0;overflow:auto;padding:20px;scrollbar-gutter:stable}h2{font-size:22px;letter-spacing:-.5px;line-height:1.25;margin:10px 0}p{line-height:1.55}.muted{color:var(--muted)}.small{font-size:12px}.welcome{padding:12px 0}.welcome p{color:var(--muted)}.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.suggestions{display:grid;gap:8px;margin:20px 0}.suggestions button{text-align:left;padding:13px 14px;line-height:1.4}.suggestions button:hover{background:var(--soft)}.thread-link{display:block;padding:10px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;width:100%;background:none}.message{margin:0 0 20px;line-height:1.6;overflow-wrap:anywhere}.message .who{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:650;color:var(--muted);margin-bottom:5px}.message.user{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-left:28px}.message .text{white-space:pre-wrap}.message.notice{border-left:2px solid #a46a24;padding-left:10px}.approval{border:1px solid #bd984f;border-radius:12px;padding:14px;margin:15px 0;background:var(--surface)}.approval strong{display:block;line-height:1.4}.approval pre{max-height:210px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace;background:var(--soft);padding:10px;border-radius:6px}.fields{margin:14px 0;padding:12px;background:var(--soft);border-radius:8px}.fields dt{font-size:11px;font-weight:650;color:var(--muted);text-transform:capitalize;margin-top:10px}.fields dt:first-child{margin-top:0}.fields dd{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;max-height:180px;overflow:auto}.actions{display:flex;gap:8px;justify-content:flex-end}.toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-top:1px solid var(--line);flex-shrink:0}.toolbar a{font-size:12px}.toolbar button{padding:6px 10px;font-size:12px}.toolbar .grow{flex:1}#composer{padding:12px 16px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);flex-shrink:0}textarea{display:block;width:100%;resize:none;border:0;background:transparent;color:inherit;line-height:1.5;padding:4px;max-height:130px;outline:0}#compose-actions{display:flex;align-items:center;gap:8px;margin-top:9px}#compose-actions select{max-width:100px;font-size:12px;background:transparent;color:var(--muted);border:0}#send{margin-left:auto}#status{flex-shrink:0;font-size:12px;color:var(--muted);padding:0 20px;min-height:25px}#error{color:#a23930;line-height:1.4;margin:0;padding:8px 20px;font-size:12px;max-height:100px;overflow:auto}#error:empty{display:none}[hidden]{display:none!important}.dot{display:inline-block;width:10px;height:10px;border:1.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}:root.dark{color:#dce7dd;background:#18221c;color-scheme:dark;--surface:#202d24;--muted:#9bb09f;--line:#35483b;--accent:#8bc4a3;--soft:#26372c}:root.dark .primary{background:#72b591;color:#132219}details{font-size:12px;color:var(--muted);margin:10px 0}summary{cursor:pointer}#selected{max-height:100px;overflow:auto;white-space:pre-wrap}#signin{display:inline-block;margin:12px 0;padding:10px 14px}

/* Markdown stays within the conversation, including narrow mobile sheets. */
.message .markdown{white-space:normal;min-width:0}
.markdown>:first-child{margin-top:0}.markdown>:last-child{margin-bottom:0}
.markdown p{margin:0 0 12px}.markdown h1,.markdown h2,.markdown h3,.markdown h4,.markdown h5,.markdown h6{margin:20px 0 10px;line-height:1.3;letter-spacing:0;font-weight:650}
.markdown h1{font-size:21px}.markdown h2{font-size:19px}.markdown h3{font-size:17px}.markdown h4,.markdown h5,.markdown h6{font-size:14px}
.markdown ul,.markdown ol{padding-left:24px;margin:10px 0 14px}.markdown li{margin:5px 0}.markdown li>p{margin:5px 0}.markdown li>ul,.markdown li>ol{margin:5px 0}
.markdown blockquote{margin:14px 0;border-left:3px solid var(--accent);padding:2px 0 2px 14px;color:var(--muted)}.markdown hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.markdown code{font: .88em/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--soft);border-radius:4px;padding:2px 4px;overflow-wrap:anywhere}
.markdown pre{max-width:100%;overflow:auto;padding:12px;background:var(--soft);border:1px solid var(--line);border-radius:9px;white-space:pre;line-height:1.5}.markdown pre code{padding:0;background:none;overflow-wrap:normal}
.table-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;border:1px solid var(--line);border-radius:9px;margin:14px 0;-webkit-overflow-scrolling:touch}
.markdown table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums}
.markdown th,.markdown td{padding:9px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);min-width:80px;overflow-wrap:normal;word-break:normal}
.markdown th{background:var(--soft);font-weight:650}.markdown tr:last-child td{border-bottom:0}.markdown th[align=right],.markdown td[align=right]{text-align:right;white-space:nowrap}.markdown th[align=center],.markdown td[align=center]{text-align:center}
.markdown input[type=checkbox]{margin:0 6px 0 0;accent-color:var(--accent)}
</style></head><body>
<header><div class="eyebrow">YOUR POCKET APPLICATIONS</div><h1>Ask about anything.</h1></header>
<div id="context"><span>Choose an item in your application</span><button id="use-current" hidden>Use current item</button></div>
<main id="content" aria-label="Conversation"><section id="welcome" class="welcome"><h2>A little help,<br>right where you are.</h2><p>Ask a question about this item, find related information, or make a change.</p><div id="access"></div><details id="selection" hidden><summary>Included text</summary><div id="selected"></div></details><div class="suggestions" id="suggestions"></div><div id="history"></div></section><div id="messages"></div></main>
<div id="status" role="status" aria-live="polite"></div><p id="error" role="alert"></p>
<div class="toolbar" id="toolbar" hidden><button id="new">New question</button><span class="grow"></span><a id="open-thread" target="_blank" rel="noopener">Open in Pocket AI ↗</a></div>
<form id="composer"><textarea id="question" rows="2" aria-label="Your question" placeholder="What would you like to know?" maxlength="30000"></textarea><div id="compose-actions"><select id="model" aria-label="Model"><option value="sonnet">Sonnet</option><option value="haiku">Haiku</option><option value="opus">Opus</option></select><button type="button" id="stop" hidden>Stop</button><button class="primary" id="send" disabled>Ask ↗</button></div></form>
<script src="/ask-markdown.js?v=1"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let origin='',app='',source=null,current=null,thread=null,connected=false,loading=false,aiURL='',timer=null,failures=0,lastSignature='',activeAccount='',accountID=0,polling=false;
try{const c=JSON.parse(decodeURIComponent(location.hash.slice(1)));origin=c.origin;app=c.app}catch{}
const labels={money:'Money',documents:'Documents',notes:'Notes',tasks:'Tasks',calendar:'Calendar',habits:'Habits',day:'Day',inventory:'Inventory',bookshelf:'Bookshelf',clips:'Clips',contacts:'Contacts',files:'Files',garage:'Garage',kitchen:'Kitchen',split:'Split',invoicing:'Invoicing',collaborator:'Collaborator',travel:'Travel',office:'Office',podcasts:'Podcasts',subtitles:'Subtitles',hub:'Hub',monitoring:'Monitoring',core:'Core',ai:'AI'};
const questions={money:['Explain this transaction','Find similar transactions','Help me categorise this expense'],documents:['Summarise this document','What dates and deadlines matter?','Find related documents'],kitchen:['Scale this recipe for 6 people','What ingredients am I missing?','Add the missing ingredients to a shopping list'],notes:['Summarise this note','Find related notes','Turn action points into tasks'],tasks:['What should I do next?','Break this task into smaller steps','Find notes related to this task'],calendar:['Summarise this event','Find related tasks and notes','Help me plan time for this'],habits:['How am I doing with this habit?','Find a pattern in my check-ins','Help me plan a small next step'],day:['Summarise my day','What did I leave unfinished?','Help me write a journal entry'],inventory:['Explain this item and its quantities','Where can I find similar items?','Help me update this item'],bookshelf:['Summarise my notes on this book','How far have I read?','Find similar books in my collection'],clips:['Summarise this clip','Find related clips and notes','Help me give this a useful title'],contacts:['Summarise this contact','Find related appointments','Help me organise this contact'],files:['Summarise this text file','Find related files','Help me organise this folder'],garage:['Summarise this vehicle’s history','What maintenance is coming up?','Help me record a maintenance note'],split:['Explain this group’s balances','Summarise these expenses','Help me record a shared expense'],invoicing:['Explain this invoice','Find invoices for this client','Help me prepare a draft invoice'],collaborator:['Summarise this review','What still needs attention?','Turn the feedback into tasks'],travel:['Summarise this trip','What is missing from my checklist?','Help me write a trip journal entry'],office:['Find related documents','What is in this folder?','Help me create a new document'],podcasts:['Summarise these show notes','Find related episodes','Add this episode to my queue'],subtitles:['Explain this subtitle file','Check the subtitle text','Help me correct its timing'],hub:['Explain my Pocket workspace','Find something across my apps','Help me organise my favourites'],monitoring:['Explain the current service status','Which services need attention?','Summarise this incident'],core:['Which Pocket apps are available?','Check the health of my applications','Explain what I can ask about'],ai:['Summarise this conversation','Find a related conversation','What should I follow up on?']};
async function api(path,body){const r=await fetch('/api/v1/ask'+path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const text=await r.text();let data;try{data=text?JSON.parse(text):null}catch{throw Error('The service returned an unreadable response. Try again shortly.')}if(!r.ok){const e=Error(data?.error||'Request failed');e.status=r.status;throw e}return data}
function error(e){$('error').textContent=e?.message||String(e)}

function context(){const c=source||current;$('context').querySelector('span').textContent=c?`${labels[c.app]||c.app} · ${c.title||'Current item'}`:'Choose an item in your application';$('use-current').hidden=!thread||!current||JSON.stringify(current)===JSON.stringify(source);$('selection').hidden=!c?.selection;$('selected').textContent=c?.selection||'';const list=$('suggestions');list.replaceChildren();for(const q of questions[c?.app]||['Summarise this item','Find related information','Help me with the next step']){const b=document.createElement('button');b.type='button';b.textContent=q;b.onclick=()=>{$('question').value=q;$('question').focus()};list.append(b)}}
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==origin||e.data?.type!=='pocket-ask-context')return;const c=e.data.source;if(!c||c.app!==app)return;try{if(new URL(c.url).origin!==origin)return}catch{return}current=c;if(!thread)source=c;document.documentElement.classList.toggle('dark',!!e.data.dark);context();ready();if(connected&&!thread)history()});
if(parent!==window&&origin)parent.postMessage({type:'pocket-ask-ready'},origin);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&parent!==window)parent.postMessage({type:'pocket-ask-close'},origin)});
function clearConversation(){clearTimeout(timer);thread=null;connected=false;$('messages').replaceChildren();$('history').replaceChildren();$('welcome').hidden=false;$('toolbar').hidden=true;$('status').textContent='';$('stop').hidden=true;ready()}
function ready(){ $('send').disabled=!connected||loading||!source; $('model').disabled=!!thread||loading }
async function status(){try{const data=await api('/status');if(accountID&&accountID!==data.user_id)clearConversation();accountID=data.user_id;connected=data.connected;aiURL=data.ai_url;activeAccount=data.name;$('access').replaceChildren();if(!connected){const p=document.createElement('p');p.className='small';p.textContent='Enable Ask to read your accessible Pocket apps. Every change needs your approval. Access lasts 30 days and can be disconnected in Core → AI connections.';const b=document.createElement('button');b.className='primary';b.textContent='Enable Pocket Ask';b.onclick=async()=>{b.disabled=true;try{await api('/connect',{approved:true});await status();$('error').textContent=''}catch(e){error(e);b.disabled=false}};$('access').append(p,b)}else{const p=document.createElement('p');p.className='small';p.textContent=`Connected${activeAccount?' as '+activeAccount:''}. You approve each change.`;$('access').append(p);await history()}ready()}catch(e){connected=false;ready();if(e.status===401){$('access').replaceChildren();const a=document.createElement('a');a.id='signin';a.className='primary';a.href='/';a.target='_blank';a.rel='noopener';a.textContent='Sign in to Pocket Core ↗';const b=document.createElement('button');b.textContent='I’m signed in';b.onclick=status;$('access').append(a,document.createElement('br'),b)}else error(e)}}
async function history(){try{const rows=await api('/threads');const box=$('history');box.replaceChildren();const related=rows.filter(t=>t.source_ref===(source?.url||current?.url)).slice(0,6);if(related.length){const h=document.createElement('h3');h.textContent='Earlier questions about this item';h.style.fontSize='13px';box.append(h);for(const t of related){const b=document.createElement('button');b.className='thread-link';b.textContent=t.title;b.onclick=()=>open(t);box.append(b)}}}catch(e){error(e)}}
function open(t){thread=t;lastSignature='';$('welcome').hidden=true;$('toolbar').hidden=false;$('open-thread').href=aiURL.replace(/\/$/,'')+'/t/'+encodeURIComponent(t.id);$('messages').replaceChildren();context();ready();poll()}
function reset(){clearTimeout(timer);thread=null;source=current;lastSignature='';$('messages').replaceChildren();$('welcome').hidden=false;$('toolbar').hidden=true;$('status').textContent='';$('stop').hidden=true;$('error').textContent='';context();ready();history()}
$('new').onclick=reset;$('use-current').onclick=reset;
function render(data){thread=data.thread;const signature=JSON.stringify(data);if(signature===lastSignature)return;lastSignature=signature;const box=$('messages'),scroll=$('content'),atBottom=scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<80;const keys=new Set();for(const item of data.items){if(!['user','assistant','request','notice'].includes(item.kind))continue;if(item.kind==='request'&&item.request?.status!=='pending')continue;keys.add(item.key);let row=[...box.children].find(n=>n.dataset.key===item.key);if(!row){row=document.createElement('div');row.dataset.key=item.key;box.append(row)}const itemSig=JSON.stringify(item);if(row.dataset.signature===itemSig)continue;row.dataset.signature=itemSig;row.replaceChildren();if(item.kind==='request'){row.className='approval';const h=document.createElement('strong');h.textContent='Approve this change?';const title=document.createElement('p');title.textContent=item.request.title;const pre=document.createElement('dl');pre.className='fields';for(const[key,value]of Object.entries(item.request.input||{})){const term=document.createElement('dt');term.textContent=key.replaceAll('_',' ');const description=document.createElement('dd');description.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);pre.append(term,description)}const actions=document.createElement('div');actions.className='actions';for(const [decision,label]of [['deny','Decline'],['allow','Allow change']]){const b=document.createElement('button');b.textContent=label;b.className=decision==='allow'?'primary':'';b.onclick=async()=>{actions.querySelectorAll('button').forEach(x=>x.disabled=true);try{await api('/threads/'+thread.id+'/requests/'+encodeURIComponent(item.request.id),{decision});await poll()}catch(e){error(e);actions.querySelectorAll('button').forEach(x=>x.disabled=false)}};actions.append(b)}row.append(h,title,pre,actions)}else{row.className='message '+item.kind;const who=document.createElement('div');who.className='who';who.textContent=item.kind==='user'?'You':item.kind==='assistant'?'Pocket Ask':'Notice';const text=document.createElement('div');text.className='text';if(item.kind==='assistant'&&window.PocketAskMarkdown){text.classList.add('markdown');window.PocketAskMarkdown.render(text,item.text||'')}else{text.textContent=item.text||''};row.append(who,text)}}for(const row of [...box.children])if(!keys.has(row.dataset.key))row.remove();const busy=['running','waiting'].includes(thread.status);$('status').replaceChildren();if(busy){if(thread.status==='running'){const dot=document.createElement('span');dot.className='dot';$('status').append(dot)}$('status').append(document.createTextNode(thread.status==='waiting'?'Waiting for your approval':'Looking into it…'))}else if(thread.error){$('status').textContent=thread.error}else{$('status').textContent=''}$('stop').hidden=!busy;if(atBottom)scroll.scrollTop=scroll.scrollHeight}
async function poll(){clearTimeout(timer);if(!thread||polling)return;polling=true;const id=thread.id;try{const data=await api('/threads/'+id);if(thread?.id!==id)return;failures=0;render(data)}catch(e){failures++;error(e);if(e.status===401){clearConversation();await status()}}finally{polling=false;if(thread?.id===id)timer=setTimeout(poll,document.hidden?10000:Math.min(15000,2000*(failures+1)))}}
$('stop').onclick=async()=>{if(!thread)return;try{await api('/threads/'+thread.id+'/interrupt',{});await poll()}catch(e){error(e)}};
$('composer').onsubmit=async e=>{e.preventDefault();const text=$('question').value.trim();if(!text||!connected||!source||loading)return;loading=true;ready();$('error').textContent='';try{if(!thread){const t=await api('/threads',{text,model:$('model').value,source});open(t)}else{await api('/threads/'+thread.id+'/messages',{text})}$('question').value='';await poll()}catch(e){error(e);if(e.status===409)await status()}finally{loading=false;ready()}};
$('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){$('composer').requestSubmit()}});
window.addEventListener('focus',()=>{if(!connected)status()});context();status();
})();
</script></body></html>
